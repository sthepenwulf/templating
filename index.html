<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Template Generator</title>

<style>

:root{
    --primary:#0056d6;
    --primary-hover:#0045aa;

    --sidebar:#081529;

    --background:#f4f7fa;
    --card:#ffffff;

    --text:#222;
    --border:#d7dce3;

    --success:#16a34a;
    --danger:#dc2626;
}

.dark{
    --background:#111827;
    --card:#1f2937;
    --text:#f3f4f6;
    --border:#374151;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--background);
    color:var(--text);
}

/* HEADER */

.topbar{
    height:70px;
    background:#002f6c;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 20px;

    color:white;
}

.topbar-left{
    display:flex;
    flex-direction:column;
}

.topbar-right{
    display:flex;
    gap:10px;
    align-items:center;
}

#currentUserLabel{
    font-size:12px;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 70px);
}

.sidebar{
    width:280px;
    background:var(--sidebar);
    color:white;
    padding:20px;
}

.content{
    flex:1;
    padding:20px;
}

/* MENU */

.sidebar-title{
    margin-top:20px;
    margin-bottom:8px;

    font-size:12px;
    text-transform:uppercase;

    opacity:.8;
}

.nav-item{
    width:100%;

    border:none;
    background:none;

    color:white;

    text-align:left;

    padding:12px;
    margin-bottom:5px;

    border-radius:8px;

    cursor:pointer;
}

.nav-item:hover{
    background:rgba(255,255,255,.08);
}

/* CARDS */

.card{
    background:var(--card);

    border-radius:12px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
    0 2px 12px rgba(0,0,0,.08);
}

.card-title{
    font-size:18px;
    font-weight:600;

    margin-bottom:20px;
}

/* FORM */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group label{
    margin-bottom:6px;
}

.form-group input{

    height:42px;

    border:
        1px solid var(--border);

    border-radius:8px;

    padding:0 12px;
}

.dark .form-group input{
    background:#374151;
    color:white;
}

.valid{
    border:2px solid var(--success)!important;
}

.invalid{
    border:2px solid var(--danger)!important;
}

/* BUTTONS */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 18px;

    border:none;
    border-radius:8px;

    cursor:pointer;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-hover);
}

.btn-secondary{
    background:#e5e7eb;
}

/* RESULT */

.output{

    width:100%;

    min-height:45px;
    height:45px;

    resize:none;
    overflow:hidden;

    padding:15px;

    border:
        1px solid var(--border);

    border-radius:8px;

    font-family:
        Consolas,
        monospace;
}

/* MESSAGES */

.message{
    display:none;

    margin-top:15px;
    padding:12px;

    border-radius:8px;
}

.message.success{
    display:block;
    background:#e8f5e9;
    color:#1b5e20;
}

.message.error{
    display:block;
    background:#ffebee;
    color:#b71c1c;
}

/* LOGIN */

.login-overlay{

    position:fixed;
    inset:0;

    background:#0f172a;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:9999;
}

.login-card{

    width:360px;

    background:white;

    border-radius:12px;

    padding:30px;

    display:flex;
    flex-direction:column;

    gap:15px;
}

.login-card input{

    height:42px;

    padding:0 12px;

    border:1px solid #ccc;

    border-radius:8px;
}

.login-error{
    color:red;
    text-align:center;
}

#btnUsers{
    display:none;
}

#btnClearHistory{
    display:none;
}

@media(max-width:900px){

    .layout{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

.btn-secondary{
    background:#e5e7eb;
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-danger:hover{
    background:#b91c1c;
}

.sg3210-interface-selector{
    grid-column:1 / -1;
    padding:15px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--background);
}

.sg3210-interface-selector select{
    width:100%;
    height:42px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card);
    color:var(--text);
}

.sg3210-interface-list{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

.sg3210-interface-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    border:1px solid var(--border);
    border-radius:6px;
    background:var(--card);
}

.sg3210-interface-item input{
    width:18px;
    height:18px;
}

@media(max-width:900px){

    .sg3210-interface-list{
        grid-template-columns:1fr;
    }

}

.sg3210-interface-selector{
    grid-column:1 / -1;
    margin-top:15px;
}

.sg3210-interface-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:10px;
}

.sg3210-interface-item{
    width:100%;
    max-width:900px;
    padding:15px;
    border:1px solid var(--border);
    border-radius:10px;
    background:var(--card);
    color:var(--text);
    box-sizing:border-box;
}

.sg3210-interface-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.sg3210-interface-config{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.sg3210-interface-config select{
    width:100%;
    height:40px;
    padding:0 10px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--card);
    color:var(--text);
}

.sg3210-custom-config{
    display:grid;
    grid-template-columns:220px minmax(400px, 1fr);
    gap:15px;
    margin-top:15px;
    width:100%;
    box-sizing:border-box;
}

.sg3210-custom-config > div{
    display:flex;
    flex-direction:column;
    gap:6px;
    min-width:0;
}

.sg3210-custom-config input{
    width:100%;
    height:42px;
    padding:0 12px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--card);
    color:var(--text);
    box-sizing:border-box;
}

.sg3210-custom-config label{
    font-weight:600;
}

.sg3210-remove-interface{
    border:none;
    background:transparent;
    color:var(--danger);
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.sg3210-remove-interface:disabled{
    opacity:.25;
    cursor:not-allowed;
}

.sg3210-add-button{
    margin-top:12px;
}
    
</style>
</head>

function addUser(
    username,
    password,
    role = "Operador"
    
){

    const users =
        getUsers();

    const exists =
        users.some(
            u => u.user === username
        );

    if(exists){
        return false;
    }

    users.push({
        user:username,
        password:password,
        role:role,
        mustChangePassword:true
    });

    localStorage.setItem(
        "telecentro_users",
        JSON.stringify(users)
    );

    return true;
}

    function deleteUser(index) {
    const users = getUsers();

    if (!users[index]) {
        alert("El usuario no existe.");
        return;
    }

    const currentUser = sessionStorage.getItem("telecentro_user");
    const userToDelete = users[index].user;

    // No permitir eliminarse a sí mismo
    if (userToDelete === currentUser) {
        alert("No podés eliminar el usuario con el que estás logueado.");
        return;
    }

    if (!confirm(`¿Deseás eliminar al usuario "${userToDelete}"?`)) {
        return;
    }

    users.splice(index, 1);

    localStorage.setItem(
        "telecentro_users",
        JSON.stringify(users)
    );

    alert(`Usuario "${userToDelete}" eliminado correctamente.`);

    // Volver a mostrar la pantalla de usuarios
    showUsers();
}

/* =====================
   LOGIN
===================== */


function login(){

    const user =
        document.getElementById("loginUser").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const users = getUsers();

    const found =
        users.find(
            u =>
            u.user === user &&
            u.password === password
        );

    if(!found){

        document.getElementById("loginError").innerText =
            "Usuario o contraseña incorrectos.";

        return;
    }

    // Si el usuario no tiene definido el campo,
    // lo consideramos como que NO debe cambiar contraseña.
    if(typeof found.mustChangePassword === "undefined"){
        found.mustChangePassword = false;
    }

    sessionStorage.setItem(
        "currentUser",
        JSON.stringify(found)
    );

    // Primer ingreso
    if(found.mustChangePassword === true){

        document.getElementById("loginScreen").style.display =
            "none";

        document.getElementById("changePasswordScreen").style.display =
            "flex";

        document.getElementById("newPassword").focus();

        return;
    }

    // Ingreso normal
    enterApplication(found);
}


    
    /* =====================
   CAMBIAR PASS PRIMER LOGIN
===================== */
 
function changePassword(){

    const newPassword =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const error =
        document.getElementById("changePasswordError");

    error.innerText = "";

    if(newPassword.length < 8){

        error.innerText =
            "La contraseña debe tener al menos 8 caracteres.";

        return;
    }

    if(newPassword !== confirmPassword){

        error.innerText =
            "Las contraseñas no coinciden.";

        return;
    }

    const currentUser =
        JSON.parse(
            sessionStorage.getItem("currentUser")
        );

    if(!currentUser){

        error.innerText =
            "Sesión inválida.";

        return;
    }

    const users = getUsers();

    const index =
        users.findIndex(
            u => u.user === currentUser.user
        );

    if(index === -1){

        error.innerText =
            "No se encontró el usuario.";

        return;
    }

    // Cambiar contraseña
    users[index].password = newPassword;

    // Ya no solicitar cambio
    users[index].mustChangePassword = false;

    // Guardar
    localStorage.setItem(
        "telecentro_users",
        JSON.stringify(users)
    );

    // Actualizar sesión
    const updatedUser = users[index];

    sessionStorage.setItem(
        "currentUser",
        JSON.stringify(updatedUser)
    );

    // Entrar a la aplicación
    enterApplication(updatedUser);
}

/* =====================
   INGRESAR A LA APP
===================== */

function enterApplication(found){

    document.getElementById(
        "currentUserLabel"
    ).innerText =
        `Usuario: ${found.user}`;

    // Ocultar pantalla de login
    document.getElementById(
        "loginScreen"
    ).style.display =
        "none";

    // Ocultar pantalla de cambio de contraseña
    document.getElementById(
        "changePasswordScreen"
    ).style.display =
        "none";

    // Mostrar aplicación
    document.getElementById(
        "appContent"
    ).style.display =
        "flex";

    // Mostrar opciones de administrador
    if(found.role === "Administrador"){

        document.getElementById(
            "btnUsers"
        ).style.display =
            "inline-block";

        document.getElementById(
            "btnClearHistory"
        ).style.display =
            "inline-block";
    }
}



function logout(){

    sessionStorage.removeItem(
        "currentUser"
    );

    location.reload();
}

/* =====================
   ADMINISTRACIÓN
===================== */

function showUserAdmin(){

    const currentUser =
        JSON.parse(
            sessionStorage.getItem("currentUser")
        );

    if(
        !currentUser ||
        currentUser.role !== "Administrador"
    ){

        showError(
            "No posee permisos para administrar usuarios."
        );

        return;
    }

    const users = getUsers();

    // Crear ventana
    const overlay =
        document.createElement("div");

    overlay.id = "userAdminOverlay";

    overlay.style.cssText = `
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.65);
        display:flex;
        justify-content:center;
        align-items:center;
        z-index:10000;
    `;

    let rows = "";

    users.forEach((u, index) => {

        const isCurrentUser =
            u.user === currentUser.user;

        rows += `
            <tr>

                <td style="
                    padding:10px;
                    border-bottom:1px solid #ddd;
                ">
                    ${u.user}
                </td>

                <td style="
                    padding:10px;
                    border-bottom:1px solid #ddd;
                ">
                    ${u.role}
                </td>

                <td style="
                    padding:10px;
                    border-bottom:1px solid #ddd;
                    text-align:center;
                ">

                    ${
                        isCurrentUser

                        ? `
                            <span style="
                                color:#777;
                                font-size:13px;
                            ">
                                Usuario actual
                            </span>
                          `

                        : `
                            <button
                                class="btn btn-danger"
                                onclick="deleteUser(${index})">

                                🗑 Eliminar

                            </button>
                          `
                    }

                </td>

            </tr>
        `;
    });

    overlay.innerHTML = `

        <div style="
            width:700px;
            max-width:90%;
            max-height:85vh;
            overflow:auto;
            background:var(--card);
            color:var(--text);
            border-radius:12px;
            padding:25px;
            box-shadow:0 10px 40px rgba(0,0,0,.3);
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:20px;
            ">

                <h2>
                    Administración de usuarios
                </h2>

                <button
                    class="btn btn-secondary"
                    onclick="closeUserAdmin()">

                    ✕ Cerrar

                </button>

            </div>


            <table style="
                width:100%;
                border-collapse:collapse;
                margin-bottom:20px;
            ">

                <thead>

                    <tr>

                        <th style="
                            text-align:left;
                            padding:10px;
                            border-bottom:2px solid #ccc;
                        ">
                            Usuario
                        </th>

                        <th style="
                            text-align:left;
                            padding:10px;
                            border-bottom:2px solid #ccc;
                        ">
                            Rol
                        </th>

                        <th style="
                            padding:10px;
                            border-bottom:2px solid #ccc;
                        ">
                            Acción
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${rows}

                </tbody>

            </table>


            <div style="
                display:flex;
                gap:10px;
                justify-content:flex-end;
            ">

                <button
                    class="btn btn-primary"
                    onclick="createNewUser()">

                    + Crear usuario

                </button>

                <button
                    class="btn btn-secondary"
                    onclick="closeUserAdmin()">

                    Cerrar

                </button>

            </div>

        </div>
    `;

    document.body.appendChild(overlay);
}

    function closeUserAdmin(){

    const overlay =
        document.getElementById(
            "userAdminOverlay"
        );

    if(overlay){
        overlay.remove();
    }
}

    /* =====================
   ADMINISTRACIÓN
===================== */
    
function createNewUser(){

                            border:1px solid var(--border);
                            border-radius:8px;
                            background:var(--card);
                            color:var(--text);

                </div>

                <div>
                    <label style="
                        display:block;
                        margin-bottom:6px;
                        font-weight:600;
                    ">
                        Rol
                    </label>

                    <select
                        id="newUserRole"
                        style="
                            width:100%;
                            height:42px;
                            padding:0 10px;
                            border:1px solid var(--border);
                            border-radius:8px;
                            background:var(--card);
                            color:var(--text);

                        <option value="Administrador">
                            Administrador
                        </option>

                </div>


                <!-- BOTONES -->

                <div style="
                    display:flex;
                    gap:10px;
                    justify-content:flex-end;
                    margin-top:10px;
                ">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelCreateUser">

                        Cancelar

                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="confirmCreateUser">

                        Crear usuario

                    </button>

                </div>

            </div>

        </div>
    `;

    document.body.appendChild(overlay);


    // Poner foco en usuario
    document
        .getElementById("newUsername")
        .focus();


    // CANCELAR

    document
        .getElementById("cancelCreateUser")
        .onclick = () => {

            overlay.remove();

        };


    // CREAR USUARIO

    document
        .getElementById("confirmCreateUser")
        .onclick = () => {

            const username =
                document
                    .getElementById("newUsername")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("newUserPassword")
                    .value;

            const role =
                document
                    .getElementById("newUserRole")
                    .value;


            // Validar usuario

            if(!username){

                alert(
                    "Debe ingresar un nombre de usuario."
                );

                return;
            }


            // Validar contraseña

            if(!password){

                alert(
                    "Debe ingresar una contraseña."
                );

                return;
            }


            if(password.length < 8){

                alert(
                    "La contraseña debe tener al menos 8 caracteres."
                );

                return;
            }


            // Crear usuario

            const created =
                addUser(
                    username,
                    password,
                    role
                );


            if(!created){

                alert(
                    `El usuario "${username}" ya existe.`
                );

                return;
            }


            alert(
                `Usuario "${username}" creado correctamente.`
            );


            // Cerrar formulario de creación

            overlay.remove();


            // Actualizar ventana de administración

            closeUserAdmin();

            showUserAdmin();

        };

}

===================== */

const validMasks = [

"255.255.255.255",
"255.255.255.254",
"255.255.255.252",
"255.255.255.248",
"255.255.255.240",
"255.255.255.224",
"255.255.255.192",
"255.255.255.128",
"255.255.255.0",
"255.255.254.0",
"255.255.252.0",
"255.255.248.0",
"255.255.240.0",
"255.255.224.0",
"255.255.192.0",
"255.255.128.0",
"255.255.0.0",
"255.254.0.0",
"255.252.0.0",
"255.248.0.0",
"255.240.0.0",
"255.224.0.0",
"255.192.0.0",
"255.128.0.0",
"255.0.0.0"

];

function validateIP(ip){

    const parts =
        ip.trim().split(".");

    if(parts.length !== 4){
        return false;
    }

    for(const part of parts){

        if(!/^\d+$/.test(part)){
            return false;
        }

        const n =
            parseInt(
                part,
                10
            );

        if(
            n < 0 ||
            n > 255
        ){
            return false;
        }

        if(
            part.length > 1 &&
            part.startsWith("0")
        ){
            return false;
        }
    }

    return true;
}

function validateMask(mask){

    return validMasks.includes(
        mask.trim()
    );
}

function validateVlan(vlan){

    if(
        !/^\d+$/.test(vlan)
    ){
        return false;
    }

    const n =
        Number(vlan);

    return (
        n >= 1 &&
        n <= 4094
    );
}

function validateField(
    value,
    fieldId
){

    const id =
        fieldId.toLowerCase();

    if(
        id.includes("ip") ||
        id.includes("gateway")
    ){

        return validateIP(value);
    }

    if(
        id.includes("mask")
    ){

        return validateMask(value);
    }

    if(
        id === "vlan" ||
        id === "customervlan"
    ){

        return validateVlan(value);
    }

    return true;
}

/* =====================
   FORM BUILDER
===================== */

function createField(field){

    const placeholder =
        field.placeholder ||
        field.label;

    return `
    <div class="form-group">

        <label>
            ${field.label}
        </label>

        <input
            id="${field.id}"
            placeholder="${placeholder}">

    </div>
    `;
}

function applyValidators(){

    document
    .querySelectorAll(
        "#formContainer input"
    )
    .forEach(input => {

        input.addEventListener(
            "input",
            () => {

                /* reemplazar espacios */

                if(
                    input.id ===
                    "service"
                ){

                    input.value =
                        input.value.replace(
                            /\s+/g,
                            "_"
                        );
                }

                const value =
                    input.value.trim();

                if(value === ""){

                    input.classList.remove(
                        "valid",
                        "invalid"
                    );

                    return;
                }

                if(
                    validateField(
                        value,
                        input.id
                    )
                ){

                    input.classList.add(
                        "valid"
                    );

                    input.classList.remove(
                        "invalid"
                    );
                }
                else{

                    input.classList.add(
                        "invalid"
                    );

                    input.classList.remove(
                        "valid"
                    );
                }
            }
        );
    });
}

function getData(){

    const data = {};

    document
        .querySelectorAll("#formContainer input")
        .forEach(field => {

            if(
                field.classList.contains("sg3210-custom-vlan") ||
                field.classList.contains("sg3210-custom-description")
            ){
                return;
            }

            data[field.id] =
                field.value.trim();

        });


    if(currentTemplate === "sg3210"){

        data.interfaces = [

            /*
             * 1/0/1 siempre usa los datos
             * principales del formulario.
             */

            {
                port: "1/0/1",
                vlan: data.vlan,
                description: data.service,
                same: true
            }

        ];


        /*
         * Agregar las interfaces adicionales
         */

        document
            .querySelectorAll(
                "#sg3210InterfaceList .sg3210-interface-item"
            )
            .forEach(item => {

                const mode =
                    item.querySelector(
                        ".sg3210-config-mode"
                    ).value;


                const customVlan =
                    item.querySelector(
                        ".sg3210-custom-vlan"
                    );


                const customDescription =
                    item.querySelector(
                        ".sg3210-custom-description"
                    );


                data.interfaces.push({

                    port:
                        item.dataset.port,

                    same:
                        mode === "same",

                    vlan:
                        mode === "same"
                            ? data.vlan
                            : customVlan.value.trim(),

                    description:
                        mode === "same"
                            ? data.service
                            : customDescription.value.trim()

                });

            });

    }


    return data;
}

/* =====================
   LOAD TEMPLATE
===================== */

function loadTemplate(
    templateName
){

    const hayDatos =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            input =>
            input.value.trim() !== ""
        );

    const hayResultado =
        document
        .getElementById(
            "output"
        )
        .value.trim() !== "";

    if(
        hayDatos ||
        hayResultado
    ){

        const confirmar =
            confirm(
                "Hay datos cargados. ¿Desea descartarlos?"
            );

        if(!confirmar){
            return;
        }

        clearFormSilent();
    }

    currentTemplate =
        templateName;

    const tpl =
        templates[
            templateName
        ];

    document
    .getElementById(
        "templateTitle"
    )
    .innerText =
        tpl.title;

    let html = "";

    tpl.fields.forEach(
        field => {

            html +=
                createField(
                    field
                );

        }
    );

    document
.getElementById(
    "formContainer"
)
.innerHTML =
    html;

if(templateName === "sg3210"){
    createSG3210InterfaceSelector();
}

applyValidators();

}

function createSG3210InterfaceSelector(){

    const container = document.createElement("div");

    container.className = "sg3210-interface-selector";

    container.innerHTML = `
        <div class="form-group">

            <label>
                Interfaces adicionales
            </label>

            <div id="sg3210InterfaceList"
                 class="sg3210-interface-list">

                <!--
                    1/0/1 NO se muestra aquí.
                    Se configura automáticamente con los datos
                    de los campos superiores.
                -->

            </div>

            <button
                type="button"
                id="btnAddSG3210Interface"
                class="btn btn-secondary sg3210-add-button">

                + Agregar interfaz

            </button>

        </div>
    `;

    document
        .getElementById("formContainer")
        .appendChild(container);


    /*
     * Agregar interfaz
     */

    document
        .getElementById("btnAddSG3210Interface")
        .addEventListener("click", function(){

            const list =
                document.getElementById(
                    "sg3210InterfaceList"
                );


            const items =
                Array.from(
                    list.querySelectorAll(
                        ".sg3210-interface-item"
                    )
                );


            const usedPorts =
                items.map(
                    item => item.dataset.port
                );


            /*
             * Buscar siguiente interfaz.
             *
             * Empieza en 1/0/2 porque
             * 1/0/1 es la interfaz principal.
             *
             * Termina en 1/0/8 porque
             * 1/0/9 es el uplink.
             */

            let nextPort = null;

            for(let i = 2; i <= 8; i++){

                const port = `1/0/${i}`;

                if(!usedPorts.includes(port)){

                    nextPort = port;

                    break;
                }
            }


            if(!nextPort){

                alert(
                    "No hay más interfaces disponibles. Las interfaces adicionales son 1/0/2 a 1/0/8."
                );

                return;
            }


            /*
             * Crear nueva interfaz
             */

            const item =
                document.createElement("div");

            item.className =
                "sg3210-interface-item";

            item.dataset.port =
                nextPort;


            item.innerHTML = `

                <div class="sg3210-interface-header">

                    <strong>
                        GigabitEthernet ${nextPort}
                    </strong>

                    <button
                        type="button"
                        class="sg3210-remove-interface"
                        title="Eliminar interfaz">

                        ✕

                    </button>

                </div>


                <div class="sg3210-interface-config">

                    <label>
                        Configuración
                    </label>

                    <select class="sg3210-config-mode">

                        <option value="same">
                            Misma VLAN y descripción
                        </option>

                        <option value="different">
                            VLAN y descripción diferentes
                        </option>

                    </select>

                </div>


                <div class="sg3210-custom-config"
                     style="display:none;">

                    <div>

                        <label>
                            VLAN
                        </label>

                        <input
                            type="number"
                            class="sg3210-custom-vlan"
                            min="1"
                            max="4094"
                            placeholder="VLAN">

                    </div>


                    <div>

                        <label>
                            Descripción
                        </label>

                        <input
                            type="text"
                            class="sg3210-custom-description"
                            placeholder="Descripción">

                    </div>

                </div>
            `;


            list.appendChild(item);


            /*
             * Selector misma/diferente configuración
             */

            const select =
                item.querySelector(
                    ".sg3210-config-mode"
                );


            select.addEventListener(
                "change",
                function(){

                    const custom =
                        item.querySelector(
                            ".sg3210-custom-config"
                        );


                    if(this.value === "different"){

                        custom.style.display =
                            "grid";

                    }else{

                        custom.style.display =
                            "none";

                    }

                }
            );


            /*
             * Eliminar interfaz
             */

            item
                .querySelector(
                    ".sg3210-remove-interface"
                )
                .addEventListener(
                    "click",
                    function(){

                        item.remove();

                    }
                );

        });
}

/* =====================
   GENERADOR SG3210
===================== */

function generateSG3210(d){

    let config = `enable
configure

jumbo-size 9216

hostname CPE-SG3210-${d.clientId}

vlan 152
name Monitoria
exit

vlan ${d.vlan}
name ${d.service}
exit

user name telecentro privilege admin secret Inst4l4c10n3s
user name backups privilege admin secret c0rp0backup!

service password-encryption

ip ssh server

telnet disable

snmp-server community CpeSnmpTlc read-only
snmp-server community TELECENTRO-${d.clientId} read-only

ip route 0.0.0.0 0.0.0.0 ${d.gatewayMon}

interface vlan 152
description MONITORIA
ip address ${d.ipMon} ${d.maskMon}
exit
`;


    /*
     * Configuración de interfaces de cliente
     */

    d.interfaces.forEach(intf => {

        /*
         * Si utiliza la misma configuración,
         * toma VLAN y descripción del formulario principal.
         */

        const vlan =
            intf.same
                ? d.vlan
                : intf.vlan;

        const description =
            intf.same
                ? d.service
                : intf.description;


        config += `

interface gigabitEthernet ${intf.port}

description ${d.clientId}-${description}

switchport general allowed vlan ${vlan} untagged
switchport pvid ${vlan}

spanning-tree bpduguard
exit
`;

    });


    /*
     * Uplink 1/0/9
     * NO se modifica mediante el selector.
     */

    config += `

interface gigabitEthernet 1/0/9

description UPLINK-A-HUB

switchport general allowed vlan 152,${d.vlan} tagged

switchport pvid ${d.vlan}

spanning-tree
exit

interface vlan 1
shutdown
exit

spanning-tree
spanning-tree mode rstp

system-time ntp UTC-03:00 192.168.15.74 192.168.15.74 12

end

copy running-config startup-config`;

    return config;
}

/* =====================
   GENERADOR PRINCIPAL
===================== */

function generateCurrentTemplate(){

    if(!currentTemplate){

        showError(
            "Seleccione una plantilla."
        );

        return;
    }

    const data = getData();

    for(const key in data){

        if(data[key] === ""){

            showError(
                "Complete todos los campos."
            );

            return;
        }
    }

    let output = "";

    switch(currentTemplate){

        case "sg350":
            output = generateSG350(data);
        break;

        case "sg3210":
            output = generateSG3210(data);
        break;

        case "vpn":
            output = generateVPN(data);
        break;

        case "qinq":
            output = generateQinQ(data);
        break;

        case "c881ypf":
            output = generateCisco881YPF(data);
        break;

        case "c881dia":
            output = generateCisco881DIA(data);
        break;

        case "mediant":
            output = generateMediant800(data);
        break;

        default:

            showError(
                "Template no soportado."
            );
            return;
    }

    const outputArea =
        document.getElementById(
            "output"
        );

    outputArea.value = output;

    autoResizeTextarea();

    saveHistory(
        currentTemplate,
        data.clientId || ""
    );

    showSuccess(
        "Template generado correctamente."
    );
}

/* =====================
   PORTAPAPELES
===================== */

function copyTemplate(){

    const txt =
        document.getElementById(
            "output"
        ).value;

    if(!txt.trim()){

        showError(
            "No existe contenido para copiar."
        );

        return;
    }

    navigator.clipboard
        .writeText(txt)
        .then(()=>{

            showSuccess(
                "Copiado al portapapeles."
            );
        });
}

/* =====================
   DESCARGA
===================== */

function downloadTemplate(){

    const txt =
        document.getElementById(
            "output"
        ).value;

    if(!txt.trim()){

        showError(
            "No existe template generado."
        );

        return;
    }

    const blob =
        new Blob(
            [txt],
            {
                type:"text/plain"
            }
        );

    const link =
        document.createElement(
            "a"
        );

    link.href =
        URL.createObjectURL(blob);

    link.download =
        `${currentTemplate}.txt`;

    link.click();

    URL.revokeObjectURL(
        link.href
    );
}

/* =====================
   LIMPIEZA
===================== */

function clearFormSilent(){

    document
        .querySelectorAll(
            "#formContainer input"
        )
        .forEach(input => {

            input.value = "";

            input.classList.remove(
                "valid",
                "invalid"
            );

        });

    document
        .getElementById("output")
        .value = "";

    document
        .getElementById("message")
        .className = "message";
}

function clearForm(){

    const hayDatos =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            input =>
            input.value.trim() !== ""
        );

    const hayResultado =
        document
            .getElementById(
                "output"
            )
            .value
            .trim() !== "";

    if(
        !hayDatos &&
        !hayResultado
    ){
        return;
    }

    const confirmar =
        confirm(
            "¿Desea limpiar el formulario y el resultado?"
        );

    if(!confirmar){
        return;
    }

    clearFormSilent();

    showSuccess(
        "Formulario limpiado."
    );
}

/* =====================
   HISTORIAL
===================== */

function saveHistory(
    template,
    client
){

    const history =
        JSON.parse(
            localStorage.getItem(
                "telecentro_history"
            ) || "[]"
        );

    history.unshift({

        date:
        new Date()
        .toLocaleString(),

        template,
        client

    });

    if(history.length > 20){
        history.length = 20;
    }

    localStorage.setItem(
        "telecentro_history",
        JSON.stringify(history)
    );

    renderHistory();
}

function renderHistory(){

    const history =
        JSON.parse(
            localStorage.getItem(
                "telecentro_history"
            ) || "[]"
        );

    let html = `
    <div class="card-title">
        Historial
    </div>
    `;

    history.forEach(item => {

        html += `
        <div style="
            margin-bottom:15px;
            padding:10px;
            border-bottom:1px solid #ddd;
        ">

            <div>
                <strong>Fecha:</strong>
                ${item.date}
            </div>

            <div>
                <strong>Plantilla:</strong>
                ${item.template}
            </div>

            <div>
                <strong>Cliente:</strong>
                ${item.client}
            </div>

        </div>
        `;
    });

    document.getElementById(
        "historyPanel"
    ).innerHTML =
    html;
}

function clearHistory(){

    const currentUser =
        JSON.parse(
            sessionStorage.getItem(
                "currentUser"
            )
        );

    if(
        !currentUser ||
        currentUser.role !==
        "Administrador"
    ){

        showError(
            "No posee permisos para eliminar el historial."
        );

        return;
    }

    const confirmar =
        confirm(
            "¿Desea eliminar todo el historial?"
        );

    if(!confirmar){
        return;
    }

    localStorage.removeItem(
        "telecentro_history"
    );

    renderHistory();

    showSuccess(
        "Historial eliminado."
    );
}

/* =====================
   INICIO
===================== */

window.onload = () => {

    renderHistory();

    currentTemplate = "sg350";

    const tpl =
        templates["sg350"];

    document.getElementById(
        "templateTitle"
    ).innerText =
    tpl.title;

    let html = "";

    tpl.fields.forEach(field => {

        html += createField(field);

    });

    document.getElementById(
        "formContainer"
    ).innerHTML =
    html;

    applyValidators();

    document
        .getElementById("output")
        .addEventListener(
            "input",
            autoResizeTextarea
        );
};
