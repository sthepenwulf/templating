/* ==========
VALIDACIONES
========== */

const validMasks = [

"255.255.255.255",
"255.255.255.254",
"255.255.255.252",
"255.255.255.248",
"255.255.255.240",
"255.255.255.224",

"255.252.0.0",
"255.248.0.0",
"255.240.0.0",
"255.224.0.0",
"255.192.0.0",
"255.128.0.0",
"255.0.0.0"

];

function validateIP(ip){

const parts =
ip.trim().split(".");

if(parts.length !== 4){
return false;
}

for(const part of parts){

if(!/^\d+$/.test(part)){
return false;
}

const n =
parseInt(part,10);

if(n < 0 || n > 255){
return false;
}

if(
part.length > 1 &&
part.startsWith("0")
){
return false;
}

}

return true;
}

function validateMask(mask){

return validMasks.includes(
mask.trim()
);

}

function validateVlan(vlan){

if(!/^\d+$/.test(vlan)){
return false;
}

const n =
Number(vlan);

return (
n >= 1 &&
n <= 4094
);

}

function validateService(service){

    return !/\s/.test(service);

}

function ipToInt(ip){

return ip
.split(".")
.reduce(
(acc,val)=>
(acc << 8) +
parseInt(val,10),
0
) >>> 0;

}

function isNetworkOrBroadcast(
ip,
mask
){

if(
!validateIP(ip) ||
!validateMask(mask)
){
return false;
}

const ipNum =
ipToInt(ip);

const maskNum =
ipToInt(mask);

const network =
ipNum & maskNum;

const broadcast =
network |
(~maskNum >>> 0);

return (
ipNum === network ||
ipNum === broadcast
);

}

function validateField(
value,
fieldId
){

const id =
fieldId.toLowerCase();

if(
id.includes("ip") ||
id.includes("gateway")
){

return validateIP(value);

}

if(
id.includes("mask")
){

return validateMask(value);

}

if(
id === "vlan" ||
id === "customervlan"
){

return validateVlan(value);

}

if(id === "service"){

    return validateService(value);

}

return true;
}

function clearForm(){

        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            input => input.value.trim() !== ""
        );

    const hayTemplate =
        document.getElementById("output")
        .value.trim() !== "";

    if(!hayDatosFormulario && !hayTemplate){
        return;
    }

    const confirmar = confirm(
        "¿Desea limpiar el formulario y borrar el template generado?"
    );

        return;
    }

        "Formulario limpiado."

"formContainer"
)
.innerHTML = html;

/* ==========
GENERADOR PRINCIPAL
========== */

function generateCurrentTemplate(){

if(!currentTemplate){

showError(
"Seleccione una plantilla."
);

return;
}

const data = getData();

if(
    data.service &&
    /\s/.test(data.service)
){

    showError(
        "El campo Servicio no puede contener espacios. Ejemplo: ADI_100MB"
    );

    return;
}

for(const key in data){

if(data[key] === ""){

showError(
"Complete todos los campos."
);

return;
}

}

let output = "";

switch(currentTemplate){

case "sg350":
output =
generateSG350(data);
break;

case "sg3210":
output =
generateSG3210(data);
break;

case "vpn":
output =
generateVPN(data);
break;

case "qinq":
output =
generateQinQ(data);
break;

case "c881ypf":
output =
generateCisco881YPF(data);
break;

case "c881dia":
output =
generateCisco881DIA(data);
break;

case "mediant":
output =
generateMediant800(data);
break;

default:

showError(
"Plantilla desconocida."
);

return;
}

const outputArea =
    document.getElementById("output");

outputArea.value = output;

outputArea.style.height = "45px";
outputArea.style.height =
    outputArea.scrollHeight + "px";

saveHistory(
currentTemplate,
data.clientId || ""
);

showSuccess(
"Template generado correctamente."
);

}

function clearFormSilent(){

    document
    .querySelectorAll(
        "#formContainer input"
    )
    .forEach(input => {

        input.value = "";

        input.classList.remove(
            "valid",
            "invalid"
        );

    });

    document
    .getElementById("output")
    .value = "";

    document
    .getElementById("message")
    .className = "message";

    document
    .getElementById("message")
    .innerText = "";
}

/* ==========
PORTAPAPELES
========== */

function copyTemplate(){

const txt =
document
.getElementById("output")
.value;

if(!txt.trim()){

showError(
"No hay contenido."
);

return;
}

navigator.clipboard
.writeText(txt)
.then(()=>{

showSuccess(
"Copiado al portapapeles."
);

});
}

function clearForm(){

    const hayDatosFormulario =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            input => input.value.trim() !== ""
        );

    const hayTemplate =
        document.getElementById("output")
        .value.trim() !== "";

    if(
        !hayDatosFormulario &&
        !hayTemplate
    ){
        return;
    }

    const confirmar = confirm(
        "¿Desea limpiar el formulario y borrar el template generado?"
    );

    if(!confirmar){
        return;
    }

    clearFormSilent();

    showSuccess(
        "Formulario limpiado."
    );
}

/* ==========
DESCARGA
========== */
function loadTemplate(templateName){

    const hayDatosFormulario =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            input => input.value.trim() !== ""
        );

    const hayTemplate =
        document.getElementById("output")
        .value.trim() !== "";

    if(hayDatosFormulario || hayTemplate){

        const continuar = confirm(
            "Hay información cargada. ¿Desea descartarla y cambiar de plantilla?"
        );

        if(!continuar){
            return;
        }
    }

    clearFormSilent();

    currentTemplate = templateName;

    const tpl =
        templates[templateName];

    document.getElementById(
        "templateTitle"
    ).innerText = tpl.title;

    let html = "";

    tpl.fields.forEach(field=>{

        html += createField(field);

    });

    document.getElementById(
        "formContainer"
    ).innerHTML = html;

    applyValidators();
}
/* ==========
HISTORIAL
========== */

function saveHistory(
template,
client
){

const history =
JSON.parse(
localStorage.getItem(
"telecentro_history"
) || "[]"
);

history.unshift({

date:
new Date()
.toLocaleString(),

template,
client

});

if(history.length > 20){
history.length = 20;
}

localStorage.setItem(
"telecentro_history",
JSON.stringify(history)
);

renderHistory();
}

function renderHistory(){

const history =
JSON.parse(
localStorage.getItem(                                        
"telecentro_history"
) || "[]"
);

let html = `
<div class="card-title">
Historial
</div>
`;

if(history.length === 0){

html += `
<p>
Sin registros
</p>
`;
}
else{

html += "<ul>";

history.forEach(item=>{

html += `
<li>

${item.date}

|

<strong>
${item.template}
</strong>

|

${item.client}

</li>
`;
});

html += "</ul>";
}

document
.getElementById(
"historyPanel"
)
.innerHTML = html;
}

function clearHistory(){

localStorage.removeItem(
"telecentro_history"
);

renderHistory();

showSuccess(
"Historial eliminado."
);

}

function validateService(service){

    return !/\s/.test(service);
}

function autoResizeTextarea(){

    const textarea =
        document.getElementById("output");

    textarea.style.height = "45px";
    textarea.style.height =
        textarea.scrollHeight + "px";
}

    function showUserAdmin(){

    const currentUser =
        JSON.parse(
            sessionStorage.getItem(
                "currentUser"
            )
        );

    if(
        !currentUser ||
        currentUser.role !==
        "Administrador"
    ){

        alert(
            "Solo los administradores pueden gestionar usuarios."
        );

        return;
    }

    const username =
        prompt("Nuevo usuario:");

    if(!username){
        return;
    }

    const password =
        prompt("Contraseña:");

    if(!password){
        return;
    }

    addUser(
        username,
        password
    );

    alert(
        "Usuario creado correctamente."
    );
}
