<style>

:root{

    --primary:#0056d6;
    --primary-hover:#0045aa;

    --sidebar:#081529;

    --background:#f4f7fa;
    --card:#ffffff;

    --text:#222222;
    --border:#d7dce3;

    --success:#16a34a;
    --danger:#dc2626;
}

.dark{

    --background:#111827;
    --card:#1f2937;
    --text:#f3f4f6;
    --border:#374151;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    Arial,
    sans-serif;

    background:

    color:

/* =====================
   TOPBAR
===================== */

.topbar{

    height:70px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 20px;

    background:#002f6c;

    color:white;
}

.topbar h1{

    font-size:22px;
}

#currentUserLabel{

    font-size:12px;

    opacity:.9;

    margin-top:4px;
}

.topbar-left{
    display:flex;
    flex-direction:column;
}

.topbar-right{
    display:flex;
    align-items:center;
    gap:10px;
    margin-left:auto;
}
    
/* =====================
   LAYOUT
===================== */

.layout{

    display:flex;

    min-height:
    calc(100vh - 70px);
}

.sidebar{

    width:280px;

    background:
    var(--sidebar);

    color:white;

    padding:20px;
}

.content{

    flex:1;

    padding:20px;
}

/* =====================
   SIDEBAR
===================== */

.sidebar-title{

    font-size:12px;

    text-transform:uppercase;

    opacity:.7;

    margin-top:18px;

    margin-bottom:8px;
}

.nav-item{

    width:100%;

    border:none;

    background:none;

    color:white;

    text-align:left;

    padding:12px;

    margin-bottom:5px;

    border-radius:8px;

    cursor:pointer;

    transition:.2s;
}

.nav-item:hover{

    background:
    rgba(255,255,255,.08);
}

/* =====================
   CARDS
===================== */

.card{

    background:
    var(--card);

    border-radius:12px;

    padding:20px;

    margin-bottom:20px;

    box-shadow:
    0 2px 12px rgba(0,0,0,.08);
}

.card-title{

    font-size:18px;

    font-weight:600;

    margin-bottom:20px;
}

/* =====================
   FORMULARIOS
===================== */

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:15px;
}

.form-group{

    display:flex;

    flex-direction:column;
}

.form-group label{

    margin-bottom:6px;

    font-size:14px;
}

.form-group input{

    height:42px;

    border:
    1px solid var(--border);

    border-radius:8px;

    padding:0 12px;

    font-size:14px;
}

.dark .form-group input{

    background:#374151;

    color:white;
}

.valid{
    border:2px solid var(--success)!important;
}

.invalid{
    border:2px solid var(--danger)!important;
}

/* =====================
   BOTONES
===================== */

.actions{

    display:flex;

    gap:10px;

    flex-wrap:wrap;
}

.btn{

    border:none;

    border-radius:8px;

    padding:12px 18px;

    cursor:pointer;
}

.btn-primary{

    background:
    var(--primary);

    color:white;
}

.btn-primary:hover{

    background:
    var(--primary-hover);
}

.btn-secondary{

    background:#e5e7eb;
}

#btnUsers{

    display:none;
}

#btnClearHistory{
    display:none;
}

/* =====================
   RESULTADO
===================== */

.output{

    width:100%;

    min-height:45px;

    height:45px;

    padding:15px;

    border:
    1px solid var(--border);

    border-radius:8px;

    resize:none;

    overflow:hidden;

    font-family:
    Consolas,
    monospace;
}

/* =====================
   MENSAJES
===================== */

.message{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:8px;
}

.message.success{

    display:block;

    background:#e8f5e9;

    color:#1b5e20;
}

.message.error{

    display:block;

    background:#ffebee;

    color:#b71c1c;
}

/* =====================
   LOGIN
===================== */

.login-overlay{

    position:fixed;

    inset:0;

    background:#0f172a;

    display:flex;

    justify-content:center;

    align-items:center;

    z-index:99999;
}

.login-card{

    width:360px;

    background:white;

    border-radius:14px;

    padding:30px;

    box-shadow:
    0 20px 40px rgba(0,0,0,.3);

.login-card h2{

}

.login-card input{

    border-radius:8px;

    padding:0 12px;

.login-error{

    color:#dc2626;

    text-align:center;

    font-size:14px;

/* =====================
   RESPONSIVE
===================== */

@media(max-width:900px){

    .layout{

        flex-direction:column;
    }

    .sidebar{

        width:100%;
    }

    .form-grid{

        grid-template-columns:1fr;
    }
}

</style>

</head>

function addUser(
    username,
    password,
    role = "Operador"
){

    const users = getUsers();

    const exists =
        users.some(
            u => u.user === username
        );

    if(exists){
        return false;
    }

    users.push({
        user: username,
        password: password,
        role: role
    });

    localStorage.setItem(
        "telecentro_users",
        JSON.stringify(users)
    );

    return true;
}

/* =====================
   LOGIN
===================== */

function login(){

    const user =
        document.getElementById(
            "loginUser"
        ).value.trim();

    const password =
        document.getElementById(
            "loginPassword"
        ).value;

    const users =
        getUsers();

    const found =
        users.find(
            u =>
                u.user === user &&
                u.password === password
        );

    if(!found){

        document.getElementById(
            "loginError"
        ).innerText =
        "Usuario o contraseña incorrectos.";

        return;
    }

    sessionStorage.setItem(
        "currentUser",
        JSON.stringify(found)
    );

    document.getElementById(
        "currentUserLabel"
    ).innerText =
    `Usuario: ${found.user}`;

    if(
    found.role ===
    "Administrador"
){

    document.getElementById(
        "btnUsers"
    ).style.display = "block";

    document.getElementById(
        "btnClearHistory"
    ).style.display = "inline-block";
}

    document.getElementById(
        "loginScreen"
    ).style.display = "none";

    document.getElementById(
        "appContent"
    ).style.display = "flex";
}

function logout(){

    sessionStorage.removeItem(
        "currentUser"
    );

    location.reload();
}

function showUserAdmin(){

    const currentUser =
        JSON.parse(
            sessionStorage.getItem(
                "currentUser"
            )
        );

    if(
        !currentUser ||
        currentUser.role !==
        "Administrador"
    ){

        showError(
            "No posee permisos para administrar usuarios."
        );

        return;
    }

    const username =
        prompt("Nuevo usuario:");

    if(!username){
        return;
    }

    const password =
        prompt("Contraseña:");

    if(!password){
        return;
    }

    const created =
        addUser(
            username,
            password
        );

    if(!created){

        showError(
            "El usuario ya existe."
        );

        return;
    }

    showSuccess(
        "Usuario creado correctamente."
    );
}

];

function validateIP(ip){

    const parts =
        ip.trim().split(".");

    if(parts.length !== 4){
        return false;
    }

    for(const part of parts){

        if(!/^\d+$/.test(part)){
            return false;
        }

        const n =
            parseInt(part,10);

        if(
            n < 0 ||
            n > 255
        ){
            return false;
        }

        if(
            part.length > 1 &&
            part.startsWith("0")
        ){
            return false;
        }
    }

    return true;
}

function validateMask(mask){

    return validMasks.includes(
        mask.trim()
    );
}

function validateVlan(vlan){

    if(!/^\d+$/.test(vlan)){
        return false;
    }

    const n =
        Number(vlan);

    return (
        n >= 1 &&
        n <= 4094
    );
}

function validateField(
    value,
    fieldId
){

    const id =
        fieldId.toLowerCase();

    if(
        id.includes("ip") ||
        id.includes("gateway")
    ){

        return validateIP(value);
    }

    if(
        id.includes("mask")
    ){

        return validateMask(value);
    }

    if(
        id === "vlan" ||
        id === "customervlan"
    ){

        return validateVlan(value);
    }

    return true;
}

 /* =====================
   FORM BUILDER
===================== */

function createField(field){

    const placeholder =
        field.placeholder ||
        field.label;

    return `
    <div class="form-group">

        <label>
        ${field.label}
        </label>

        <input
            id="${field.id}"
            placeholder="${placeholder}">

    </div>
    `;
}

function applyValidators(){

    document
    .querySelectorAll(
        "#formContainer input"
    )
    .forEach(input => {

        input.addEventListener(
            "input",
            () => {

                /* remplazar espacios */
                if(
                    input.id ===
                    "service"
                ){

                    input.value =
                    input.value.replace(
                        /\s+/g,
                        "_"
                    );
                }

                const value =
                    input.value.trim();

                if(value === ""){

                    input.classList.remove(
                        "valid",
                        "invalid"
                    );

                    return;
                }

                if(
                    validateField(
                        value,
                        input.id
                    )
                ){

                    input.classList.add(
                        "valid"
                    );

                    input.classList.remove(
                        "invalid"
                    );
                }
                else{

                    input.classList.add(
                        "invalid"
                    );

                    input.classList.remove(
                        "valid"
                    );
                }
            }
        );
    });
}

function getData(){

    const data = {};

    document
    .querySelectorAll(
        "#formContainer input"
    )
    .forEach(field => {

        data[
            field.id
        ] =
        field.value.trim();

    });

    return data;
}

/* =====================
   LOAD TEMPLATE
===================== */

function loadTemplate(
    templateName
){

    const hayDatos =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            i => i.value.trim() !== ""
        );

    const hayResultado =
        document
        .getElementById(
            "output"
        )
        .value
        .trim() !== "";

    if(
        hayDatos ||
        hayResultado
    ){

        const continuar =
            confirm(
                "Hay datos cargados. ¿Desea descartarlos?"
            );

        if(
            !continuar
        ){
            return;
        }

        clearFormSilent();
    }

    currentTemplate =
        templateName;

    const tpl =
        templates[
            templateName
        ];

    document
    .getElementById(
        "templateTitle"
    )
    .innerText =
        tpl.title;

    let html = "";

    tpl.fields.forEach(
        field => {

            html +=
            createField(
                field
            );

        }
    );

    document
    .getElementById(
        "formContainer"
    )
    .innerHTML =
        html;

    applyValidators();
}

/* =====================
   GENERADOR PRINCIPAL
===================== */

function generateCurrentTemplate(){

    if(!currentTemplate){

        showError(
            "Seleccione una plantilla."
        );

        return;
    }

    const data =
        getData();

    for(const key in data){

        if(
            data[key] === ""
        ){

            showError(
                "Complete todos los campos."
            );

            return;
        }
    }

    let output = "";

    switch(currentTemplate){

        case "sg350":
            output =
            generateSG350(data);
        break;

        case "sg3210":
            output =
            generateSG3210(data);
        break;

        case "vpn":
            output =
            generateVPN(data);
        break;

        case "qinq":
            output =
            generateQinQ(data);
        break;

        case "c881ypf":
            output =
            generateCisco881YPF(data);
        break;

        case "c881dia":
            output =
            generateCisco881DIA(data);
        break;

        case "mediant":
            output =
            generateMediant800(data);
        break;
    }

    const outputArea =
        document.getElementById(
            "output"
        );

    outputArea.value =
        output;

    autoResizeTextarea();

    saveHistory(
        currentTemplate,
        data.clientId || ""
    );

    showSuccess(
        "Template generado correctamente."
    );
}

/* =====================
   PORTAPAPELES
===================== */

function copyTemplate(){

    const txt =
        document.getElementById(
            "output"
        ).value;

    if(!txt.trim()){

        showError(
            "No hay resultado para copiar."
        );

        return;
    }

    navigator.clipboard
    .writeText(txt)
    .then(() => {

        showSuccess(
            "Copiado al portapapeles."
        );

    });
}

/* =====================
   DESCARGA
===================== */

function downloadTemplate(){

    const txt =
        document.getElementById(
            "output"
        ).value;

    if(!txt.trim()){

        showError(
            "No hay template generado."
        );

        return;
    }

    const blob =
        new Blob(
            [txt],
            {
                type:"text/plain"
            }
        );

    const link =
        document.createElement(
            "a"
        );

    link.href =
        URL.createObjectURL(
            blob
        );

    link.download =
        `${currentTemplate}.txt`;

    link.click();

    URL.revokeObjectURL(
        link.href
    );
}

/* =====================
   LIMPIEZA
===================== */

function clearFormSilent(){

    document
    .querySelectorAll(
        "#formContainer input"
    )
    .forEach(input => {

        input.value = "";

        input.classList.remove(
            "valid",
            "invalid"
        );
    });

    document
    .getElementById(
        "output"
    )
    .value = "";

    document
    .getElementById(
        "message"
    )
    .className =
    "message";
}

function clearForm(){

    const hayDatos =
        Array.from(
            document.querySelectorAll(
                "#formContainer input"
            )
        ).some(
            e =>
            e.value.trim() !== ""
        );

    const hayResultado =
        document.getElementById(
            "output"
        ).value.trim() !== "";

    if(
        !hayDatos &&
        !hayResultado
    ){
        return;
    }

    if(
        !confirm(
            "¿Desea limpiar el formulario?"
        )
    ){
        return;
    }

    clearFormSilent();

    showSuccess(
        "Formulario limpiado."
    );
}

/* =====================
   HISTORIAL
===================== */

function saveHistory(
    template,
    client
){

    const history =
        JSON.parse(
            localStorage.getItem(
                "telecentro_history"
            ) || "[]"
        );

    history.unshift({

        date:
        new Date()
        .toLocaleString(),

        template,
        client
    });

    if(
        history.length > 20
    ){
        history.length = 20;
    }

    localStorage.setItem(
        "telecentro_history",
        JSON.stringify(history)
    );

    renderHistory();
}

function renderHistory(){

    const history =
        JSON.parse(
            localStorage.getItem(
                "telecentro_history"
            ) || "[]"
        );

    let html = `
        <div class="card-title">
            Historial
        </div>
    `;

    history.forEach(item => {

        html += `
<div style="
    margin-bottom:15px;
    padding:10px;
    border-bottom:1px solid #ddd;
">

    <div>
        <strong>Fecha:</strong>
        ${item.date}
    </div>

    <div>
        <strong>Plantilla:</strong>
        ${item.template}
    </div>

    <div>
        <strong>Cliente:</strong>
        ${item.client}
    </div>

</div>
;

    document
    .getElementById(
        "historyPanel"
    )
    .innerHTML = html;
}

function clearHistory(){

    const currentUser =
        JSON.parse(
            sessionStorage.getItem(
                "currentUser"
            )
        );

    if(
        !currentUser ||
        currentUser.role !==
        "Administrador"
    ){

        showError(
            "No posee permisos para eliminar el historial."
        );

        return;
    }

    const confirmar =
        confirm(
            "¿Desea eliminar todo el historial?"
        );

    if(!confirmar){
        return;
    }

    localStorage.removeItem(
        "telecentro_history"
    );

    renderHistory();

    showSuccess(
        "Historial eliminado."
    );
}
